name: DICE admin alpha checks
on:
  pull_request:
    branches: [cursor/nora-2-update-d133]
    paths:
      - 'community_bot/beta_games.py'
      - 'community_bot/miniapp.py'
      - 'community_bot/poker_api.py'
      - 'community_bot/web/dice*'
      - 'community_bot/web/app.js'
      - 'community_bot/web/interactive.js'
      - 'tests/test_beta_games.py'
      - 'tests/dice_core.test.cjs'
      - 'tests/dice_preview.test.cjs'
      - '.github/workflows/dice-admin-checks.yml'
permissions:
  contents: read
jobs:
  dice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_beta_games.py
      - run: node --test tests/dice_core.test.cjs tests/dice_preview.test.cjs
      - run: |
          node --check community_bot/web/dice.js
          node --check community_bot/web/dice-core.js
          node --check community_bot/web/app.js
          node --check community_bot/web/shop.js
          node --check community_bot/web/interactive.js
