name: Staff Chat Media Checks
on:
  push:
    branches: [cursor/nora-2-update-d133]
    paths:
      - "community_bot/staff_chat.py"
      - "community_bot/staff_chat_send.py"
      - "community_bot/staff_chat_live.py"
      - "community_bot/miniapp.py"
      - "community_bot/database.py"
      - "community_bot/web/staff-chat.js"
      - "community_bot/web/index.html"
      - "tests/test_staff_chat.py"
      - ".github/workflows/staff-chat-checks.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test access, media and replies
        run: python -m pytest -q tests/test_staff_chat.py
      - name: Validate browser syntax
        run: node --check community_bot/web/staff-chat.js
