name: Pet care and unlock checks

on:
  pull_request:
    branches: ["cursor/nora-2-update-d133"]
    paths:
      - "community_bot/pet_care.py"
      - "community_bot/database.py"
      - "community_bot/cabinet_api.py"
      - "community_bot/routers/nora.py"
      - "community_bot/routers/pets.py"
      - "community_bot/pet_video.py"
      - "community_bot/web/pet.js"
      - "tests/test_pet_care.py"
      - "tests/test_pet_balance.py"
      - "tests/test_pet_unlocks.py"
      - ".github/workflows/pet-care-checks.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint pet code and tests
        run: |
          python -m ruff check community_bot/pet_care.py community_bot/database.py community_bot/cabinet_api.py community_bot/routers/nora.py community_bot/routers/pets.py community_bot/pet_video.py tests/test_pet_care.py tests/test_pet_balance.py tests/test_pet_unlocks.py
      - name: Regression tests
        run: |
          python -m pytest -q tests/test_pet_care.py tests/test_pet_balance.py tests/test_pet_unlocks.py tests/test_pet_progress.py tests/test_nora_game.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pet Mini App syntax
        run: node --check community_bot/web/pet.js
