name: Referral cookie contest checks

on:
  pull_request:
    branches: ["cursor/nora-2-update-d133"]
  workflow_dispatch:

jobs:
  referral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint new referral code
        run: python -m ruff check community_bot/referral_campaign.py tests/test_referral_campaign.py
      - name: Compile changed modules
        run: |
          python -m py_compile community_bot/referral_campaign.py community_bot/community_api.py community_bot/database.py community_bot/routers/group.py community_bot/main.py
      - name: Regression tests
        run: python -m pytest -q tests/test_referral_campaign.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check community_bot/web/community.js
