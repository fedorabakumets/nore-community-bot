[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nore-community-bot"
version = "1.0.0"
description = "Telegram community bot: applications, tickets, moderation, profiles and economy"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.30,<4",
  "aiosqlite>=0.21,<1",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
nore-bot = "community_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["community_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
